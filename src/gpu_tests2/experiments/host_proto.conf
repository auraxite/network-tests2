# Проверка среды host программы gpu2: какие протоколы и транспорты UCX выбирает, когда буферы
# в памяти GPU, cuda_ipc исключён и GPUDirect RDMA выключен. Таблицы — в results/hyp_*/ucx/*.out
# (UCX_PROTO_INFO=y). Ожидается: внутри узла — cuda_copy и sm/cma, между узлами — копия в RAM и rc;
# нигде не должно быть cuda_ipc и прямой регистрации памяти GPU на адаптере.
# Запуск (2 узла по 4 GPU, как main.conf):
#   bash submit.sh --time=00:10:00 --nodes=2 --ntasks=8 --ntasks-per-node=4 --gpus-per-node=4 \
#       --nodelist=g5500-4,g5500-5 task.sbatch host_proto
# Для сравнения те же размеры в custom.

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
PROTO_BLOCKS=(proto_host proto_custom)
REQUIRE="Host staging: ucx"   # программа gpu2 с host через UCX

PLAN=()
for B in 64 1024 32768 2097152 16777216; do
	PLAN+=("proto_host   1 host   one_to_one ${B}:20:2 --order random")
	PLAN+=("proto_custom 1 custom one_to_one ${B}:20:2 --order random")
done
