# Подбор транспорта UCX по измерению — ПО МЕТОДИКЕ. Та же схема, что autothresh_method.conf, но меняется не порог
# протокола, а набор разрешённых транспортов (UCX_TLS) и GPUDirect RDMA. Порог протокола — по умолчанию UCX.
# Наборы (среда custom; адаптер у процесса тот же — ближайший к GPU; программа задаёт свои UCX_* с overwrite=0,
# поэтому значения блока важнее):
#   all   — как в custom: cuda_copy, cuda_ipc, InfiniBand, cma, sm, self; GPUDirect RDMA включён (эталон);
#   noipc — без cuda_ipc: внутри узла нет прямой передачи GPU → GPU (через RAM или через адаптер);
#   nic   — только cuda_copy, InfiniBand и self: внутри узла — через сетевой адаптер и обратно (класс c);
#   nogdr — как all, но без GPUDirect RDMA: между узлами — через RAM.
# Методика: нагрузка CPU 1 с, случайный порядок пар и запусков, диагностика до и после пары, прогрев 300 передач
# (по warmup_method: внутри узла начальный участок ~150–200 передач), несколько заданий.
# Сетка ×4: 1 Б … 16 МБ (13 размеров), 4 набора — 52 запуска.
#
# Запуск 2 заданий друг за другом на одни и те же узлы:
#   bash experiments/submit_series.sh autotransport_method 2
# Обработка:
#   python3 analysis/autotransport.py results/hyp_<1> results/hyp_<2> [--plot autotransport.png]

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--order random --prespin-sec 1 --probe)

IB="rc_verbs,rc_mlx5,ud_verbs,ud_mlx5,dc_mlx5"   # как IB_TLS в src/gpu_benchmark.cpp
BLOCK_ENV[noipc]="UCX_TLS=cuda_copy,${IB},cma,sm,self"
BLOCK_ENV[nic]="UCX_TLS=cuda_copy,${IB},self"
BLOCK_ENV[nogdr]="UCX_IB_GPU_DIRECT_RDMA=n"

PLAN=()
for B in 1 4 16 64 256 1024 4096 16384 65536 262144 1048576 4194304 16777216; do
	if (( B >= 4194304 )); then C="${B}:200:200"; else C="${B}:300:300"; fi
	for T in all noipc nic nogdr; do
		PLAN+=("${T} 1 custom one_to_one ${C}")
	done
done
