# Пара GPU разных процессоров и пороги UCX на 1.22. Два узла, на каждом GPU0 (процессор 0,
# рядом с адаптерами) и GPU2 (процессор 1, к адаптеру через межпроцессорный интерфейс).
# Запуск:
#   bash submit.sh --time=00:30:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 task.sbatch crosssocket
# --gpus-per-node=4: процессы должны видеть все GPU узла, иначе GPU2 не выбрать.
#
# Вопросы:
#   1. застревает ли пара GPU0 <-> GPU2 одного узла в custom, как в default (hyp_12013), и во сколько раз
#      она медленнее пути через RAM (host);
#   2. пороги UCX 1.22 (блок proto, таблицы UCX_PROTO_INFO): есть ли пороги 5363 Б внутри узла
#      и 566751 Б между узлами, как на 1.15; одинаковы ли они для GPU0 и GPU2.
# Итераций мало: пара разных процессоров на 4 МБ шла 1.7–3.5 с на передачу (paths_11467).
# Ожидаемое время 10–15 мин. Упавший запуск не обрывает остальные (rc в runs.csv), но если
# медленная пара окажется дольше оценки, задание упрётся в лимит времени — тогда увеличить --time.

SHUFFLE_SEED=8
SEED_BASE=8000
COLLECT_ENV=1
UCX_PATHS=1
PROTO_BLOCKS=(proto)
COMMON=(--order random --prespin-sec 1 --gpus 0,2)
REQUIRE=--gpus      # программа должна знать --gpus (иначе пересобрать)

PLAN=(
	# таблицы порогов: размер не важен, UCX печатает все диапазоны
	"proto 1 custom one_to_one 16000:20:2"
	"proto 1 default one_to_one 16000:20:2"
)
for ENV in custom default host; do
	PLAN+=("meas 1 ${ENV} one_to_one 1024:20:2")
	PLAN+=("meas 1 ${ENV} one_to_one 16000:20:2")
	PLAN+=("meas 1 ${ENV} one_to_one 4096000:5:1")
done
