# Можно ли задать порог rendezvous раздельно для соединений внутри узла и между узлами одной переменной:
# UCX_RNDV_THRESH=intra:0,inter:65 (синтаксис «ключ:значение» в UCX ≥ 1.13 — проверяется здесь).
# Сначала проверить без задания: ucx_info -c -f | grep -B2 -A6 RNDV_THRESH (описание и формат).
# Блоки: proto_auto — как сейчас; proto_split — раздельные пороги; split — замеры с ними.
# Ожидание: таблицы proto_split — rendezvous внутри узла с 0 Б, между узлами с 65 Б;
# если UCX не принимает формат — ошибка разбора в журнале блока, тогда раздельный порог одной переменной невозможен.
# Запуск (~3 мин):
#   bash submit.sh --time=00:15:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 task.sbatch rndvsplit

COLLECT_ENV=1
COMMON=(--gpus 0,1)
REQUIRE=--gpus

BLOCK_ENV[proto_split]="UCX_RNDV_THRESH=intra:0,inter:65"
BLOCK_ENV[split]="UCX_RNDV_THRESH=intra:0,inter:65"
PROTO_BLOCKS=(proto_auto proto_split)

PLAN=("proto_auto 1 custom one_to_one 1024:20:5" "proto_split 1 custom one_to_one 1024:20:5")
for B in 32 128 1024 8192 65536; do
	PLAN+=("auto 1 custom one_to_one ${B}:500:50" "split 1 custom one_to_one ${B}:500:50")
done
