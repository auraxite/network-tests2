# MPI_Send против MPI_Isend+MPI_Wait при ОДНОМ И ТОМ ЖЕ протоколе — ПО МЕТОДИКЕ, быстрый вариант.
# p2pcheck (hyp_12380) сравнивал вызовы только при пороге UCX по умолчанию: MPI_Isend быстрее, потому что UCX
# раньше переходит на rendezvous. Здесь протокол задаётся принудительно, чтобы понять, остаётся ли разница:
#   blkE / nbE — MPI_Send / MPI_Isend, только eager      (UCX_RNDV_THRESH=inf);
#   blkR / nbR — MPI_Send / MPI_Isend, только rendezvous (UCX_RNDV_THRESH=0);
#   blkA / nbA — MPI_Send / MPI_Isend, порог UCX по умолчанию (как в p2pcheck, для сравнения).
# Если при одном протоколе вызовы почти равны — выигрыш MPI_Isend целиком объясняется выбором протокола.
# GPU0 и GPU1 двух узлов (12 пар), custom, 200 итераций и 200 прогревочных, 6 размеров × 6 блоков = 36 запусков,
# ~5 мин. Методика: нагрузка CPU, случайный порядок, диагностика.
#
#   bash experiments/submit_series.sh p2pforce_method 1
#   python3 analysis/p2pforce.py results/hyp_<задание> [ещё задания ...]

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--gpus 0,1 --order random --prespin-sec 1 --probe)
REQUIRE=--p2p

for C in blk nb; do
	BLOCK_ENV[${C}E]="UCX_RNDV_THRESH=inf"
	BLOCK_ENV[${C}R]="UCX_RNDV_THRESH=0"
done

PLAN=()
for B in 128 1024 8192 65536 524288 2097152; do
	for P in A E R; do
		PLAN+=("blk${P} 1 custom one_to_one ${B}:200:200 --p2p blocking")
		PLAN+=("nb${P} 1 custom one_to_one ${B}:200:200 --p2p nonblocking")
	done
done
