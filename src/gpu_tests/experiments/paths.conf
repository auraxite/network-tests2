# Каким путём фактически идут пары GPU на узлах задания.
# Запуск: bash submit.sh --time=00:05:00 task.sbatch paths ; разбор: python parse_paths.py results/hyp_<job>
# Работает около 2–3 минут: 6 запусков по ~14 с (8 с — старт MPI и UCX) и проверки окружения.
#
# Источники:
#   1. журнал UCX уровня info по каждому рангу (ucx/*.r<ранг>.out/.err, строки ep_cfg) —
#      какие транспорты задействованы. Выбор протоколов не меняет;
#   2. блок proto: UCX_PROTO_ENABLE=y UCX_PROTO_INFO=y — таблицы «внутри узла / между узлами»
#      с протоколом и устройством для каждого диапазона размеров. Только так различаются
#      GPUDirect RDMA и передача через ОЗУ между узлами. В UCX 1.15 это другой механизм выбора
#      протоколов, поэтому задержки блока с остальными не сравнивать. Для host не нужен:
#      там путь через ОЗУ по построению;
#   3. накопительные счётчики сетевых адаптеров и NVLink до и после каждого запуска (counters/)
#      и трафик GPU по PCIe раз в секунду — подтверждение.
# Повторов нет: путь от повтора к повтору не меняется, разброс задержки — в других экспериментах.

SHUFFLE_SEED=6
SEED_BASE=6000
COLLECT_ENV=1
UCX_PATHS=1
PROTO_BLOCKS=(proto)
COMMON=(--order random --prespin-sec 1)

PLAN=(
	"info  1 auto one_to_one_v2 16000:10000:100"
	"info  1 auto one_to_one_v2 4096000:500:20"
	"proto 1 auto one_to_one_v2 16000:10000:100"
	"proto 1 auto one_to_one_v2 4096000:500:20"
	"info  1 host one_to_one_v2 16000:10000:100"
	"info  1 host one_to_one_v2 4096000:500:20"
)
