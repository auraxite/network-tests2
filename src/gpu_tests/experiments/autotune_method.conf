# Совместный подбор набора транспортов UCX и порога протокола — ПО МЕТОДИКЕ.
# Для каждого набора транспортов T на сетке размеров измеряются eager (UCX_RNDV_THRESH=inf) и rendezvous
# (UCX_RNDV_THRESH=0); для эталона (all) ещё порог UCX по умолчанию. Обработка analysis/autotune.py: для каждого
# набора — его лучший порог, затем наборы сравниваются при своих лучших порогах.
# Наборы (среда custom; программа задаёт свои UCX_* с overwrite=0, значения блока важнее):
#   all   — как в custom: cuda_copy, cuda_ipc, InfiniBand, cma, sm, self; GPUDirect RDMA;
#   noipc — без cuda_ipc;   nic — cuda_copy, InfiniBand, self (внутри узла через адаптер);
#   nogdr — как all, но без GPUDirect RDMA;
#   roce  — как all, но адаптер mlx5_1 (Ethernet 100 Гбит/с, RoCE v2, GID 3 — адрес IPv4 172.18.8.x на g5500-4/5)
#           вместо InfiniBand mlx5_0;
#   tcp   — как all, но между узлами TCP через ens18f1np1 (тот же порт mlx5_1, без RDMA).
#   roce и tcp проверены только для g5500-4/5 (адреса и GID — из снимка env_*.txt, hyp_12730); на других узлах
#   сверить `gid mlx5_1 …` и интерфейсы в env_*.txt.
# Имя блока: <набор><протокол>, протокол E — eager, R — rendezvous, A — порог UCX (только allA).
# Методика: нагрузка CPU, случайный порядок, диагностика, прогрев 200 передач.
#
# Параметры через окружение (sbatch передаёт его в задание):
#   AUTOTUNE_SETS   какие наборы мерить в этом задании (по умолчанию все: "all noipc nic nogdr");
#   AUTOTUNE_GPUS   список GPU на узле для --gpus (по умолчанию 0,1; "all" — все GPU узла);
#   AUTOTUNE_ITERS  замеряемых итераций (по умолчанию 200).
#
# Быстро, 2 GPU на узел, все наборы в одном задании (~12–15 мин):
#   bash experiments/submit_series.sh autotune_method 1
# 4 GPU на узел, по заданию на набор, результаты по мере готовности (первым — all):
#   bash experiments/autotune_series.sh
# Обработка (можно на части заданий):
#   python3 analysis/autotune.py results/hyp_<1> [results/hyp_<2> ...]

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
SETS=(${AUTOTUNE_SETS:-all noipc nic nogdr})
GPUS="${AUTOTUNE_GPUS:-0,1}"
ITERS="${AUTOTUNE_ITERS:-200}"
COMMON=(--order random --prespin-sec 1 --probe)
if [[ "${GPUS}" != all ]]; then COMMON=(--gpus "${GPUS}" "${COMMON[@]}"); fi

IB="rc_verbs,rc_mlx5,ud_verbs,ud_mlx5,dc_mlx5"   # как IB_TLS в src/gpu_benchmark.cpp
declare -A TLS=(
	[all]=""
	[noipc]="UCX_TLS=cuda_copy,${IB},cma,sm,self"
	[nic]="UCX_TLS=cuda_copy,${IB},self"
	[nogdr]="UCX_IB_GPU_DIRECT_RDMA=n"
	[roce]="UCX_NET_DEVICES=mlx5_1:1 UCX_IB_GID_INDEX=3"
	[tcp]="UCX_TLS=cuda_copy,cuda_ipc,tcp,cma,sm,self UCX_NET_DEVICES=ens18f1np1"
)
for T in "${SETS[@]}"; do
	[[ -v "TLS[$T]" ]] || { echo "autotune_method: неизвестный набор ${T}" >&2; exit 1; }
	BLOCK_ENV[${T}E]="${TLS[$T]:+${TLS[$T]} }UCX_RNDV_THRESH=inf"
	BLOCK_ENV[${T}R]="${TLS[$T]:+${TLS[$T]} }UCX_RNDV_THRESH=0"
done

PLAN=()
for B in 16 64 256 1024 4096 16384 65536 262144 1048576 4194304; do
	C="${B}:${ITERS}:200"
	for T in "${SETS[@]}"; do
		if [[ "${T}" == all ]]; then PLAN+=("allA 1 custom one_to_one ${C}"); fi
		PLAN+=("${T}E 1 custom one_to_one ${C}" "${T}R 1 custom one_to_one ${C}")
	done
done
