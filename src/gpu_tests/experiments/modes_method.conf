# Одновременные режимы ПО МЕТОДИКЕ (слайд «Предлагаемая методика»): то же, что modes.conf (hyp_12036), но
#   1) нагрузка CPU 1 с перед первым раундом (--prespin-sec 1);
#   2) случайный порядок раундов (корней) и запусков (--order random, зерно — номер задания);
#   3) диагностика до и после каждого раунда (--probe: тесты ядра и L3, raw/*.sprobe, *.rprobe);
#   5) несколько независимых заданий: ставить через experiments/submit_series.sh (оценка — медиана по заданиям).
# Два узла, GPU0 и GPU1 на каждом (одного процессора), custom и host, 4 режима, 4 размера.
# Нужна пересборка программы (методика в одновременных режимах): bash build/build.sh
# Запуск 4 заданий (~6 мин каждое):
#   bash experiments/submit_series.sh modes_method 4

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--gpus 0,1 --order random --prespin-sec 1 --probe)
REQUIRE="order of rounds"   # программа с методикой в одновременных режимах

PLAN=()
for ENV in custom host; do
	for MODE in one_to_one all_to_all one_to_all all_to_one; do
		for B in 64 32768 2097152 16777216; do
			if (( B >= 16777216 )); then C="$B:200:20"; else C="$B:500:50"; fi
			PLAN+=("modes 1 ${ENV} ${MODE} ${C}")
		done
	done
done
