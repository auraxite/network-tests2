# Порог rendezvous в одновременных режимах. autothresh (hyp_12349, hyp_12358) показал для одной пары за раз:
# лучший порог между узлами 65 Б, внутри узла rendezvous лучше с 1 Б, а UCX включает его с 556–709 КБ
# (между узлами) и 1,4–2 КБ (внутри узла). Здесь проверяется, сохраняется ли выигрыш, когда передач много
# одновременно (модель UCX может держать eager как раз ради этого):
#   auto — порог выбирает UCX;   t65 — UCX_RNDV_THRESH=65.
# Режимы one_to_one, all_to_all, one_to_all, all_to_one; GPU0 и GPU1 на узел (одного процессора:
# --sys-via-host в одновременных режимах не работает). Сравнивать auto и t65 внутри одного режима и размера.
# Обработка: python3 analysis/rndvmodes.py results/hyp_<задание>
#
# Запуск (~12 мин: 2 варианта × 4 режима × 7 размеров по ~10 с):
#   bash submit.sh --time=00:30:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 \
#        --nodelist=g5500-2,g5500-3 task.sbatch rndvmodes

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--gpus 0,1)
REQUIRE=--gpus

BLOCK_ENV[t65]="UCX_RNDV_THRESH=65"
BLOCK_ENV[proto_t65]="UCX_RNDV_THRESH=65"
PROTO_BLOCKS=(proto_auto proto_t65)

PLAN=()
for M in auto t65; do
	for MODE in one_to_one all_to_all one_to_all all_to_one; do
		for B in 128 1024 8192 65536 262144 524288 2097152; do
			PLAN+=("${M} 1 custom ${MODE} ${B}:500:50")
		done
	done
	PLAN+=("proto_${M} 1 custom all_to_all 65536:50:10")
done
