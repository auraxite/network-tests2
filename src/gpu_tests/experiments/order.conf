# Случайный порядок запусков и пар, one_to_one_v2 (бывший task3.sbatch, данные hyp_11065).
# Запуск: bash submit.sh --time=01:30:00 task.sbatch order
#   stateR — случайный порядок пар, много повторов одной конфигурации
#   stateS — тот же замер в обычном порядке пар (сравнение с прошлыми данными)
#   stateV — режим one_to_one (проверка, что one_to_one_v2 меряет то же)
#   warm   — прогрев w5 / w500 / w2000 при случайном порядке пар
#   long   — длинные серии
#   rooted — host one_to_all и all_to_one (разница внутри узла)

REQUIRE=one_to_one_v2
SHUFFLE_SEED=3
SEED_BASE=1000
LOG_FREQ=1

PLAN=(
	"stateR 6 auto one_to_one_v2 16000:2000:500 --order random"
	"stateR 6 host one_to_one_v2 16000:2000:500 --order random"
	"stateS 3 auto one_to_one_v2 16000:2000:500 --order seq"
	"stateS 3 host one_to_one_v2 16000:2000:500 --order seq"
	"stateV 3 auto one_to_one    16000:2000:500"
	"stateV 3 host one_to_one    16000:2000:500"
	"warm   2 auto one_to_one_v2 16000:2000:5      --order random"
	"warm   2 auto one_to_one_v2 16000:2000:2000   --order random"
	"warm   2 auto one_to_one_v2 4096000:2000:5    --order random"
	"warm   2 auto one_to_one_v2 4096000:2000:500  --order random"
	"warm   2 auto one_to_one_v2 4096000:2000:2000 --order random"
	"warm   2 host one_to_one_v2 16000:2000:5      --order random"
	"warm   2 host one_to_one_v2 16000:2000:2000   --order random"
	"warm   2 host one_to_one_v2 4096000:2000:5    --order random"
	"warm   2 host one_to_one_v2 4096000:2000:500  --order random"
	"warm   2 host one_to_one_v2 4096000:2000:2000 --order random"
	"long   2 auto one_to_one_v2 16000:20000:5     --order random"
	"long   2 host one_to_one_v2 16000:20000:5     --order random"
	"rooted 2 host one_to_all    4096000:500:5"
	"rooted 2 host all_to_one    4096000:500:5"
)
