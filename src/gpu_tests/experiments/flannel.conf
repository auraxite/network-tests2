# Почему UCX 1.22 без исключения TCP брал между узлами flannel.1 (сеть Kubernetes), а не ens18f1np1 с оценкой выше.
# Гипотеза: UCX не берёт два пути через одно физическое устройство, а ens18f1np1 и ens65f0np0 — порты уже
# взятых mlx5_1 и mlx5_2; flannel.1 для UCX — отдельный адаптер. Журнал debug печатает, какие пути (lanes)
# выбраны и почему отброшены остальные.
# Соединение через flannel.1 отклоняется — запуск, скорее всего, упадёт или повиснет: это ожидаемо, нужен только журнал.
# hyp_12626 (g5500-1/2, 1 процесс с GPU0 на узел): не воспроизвелось — между узлами только rc_mlx5/mlx5_0.
# Исходный случай hyp_12011: g5500-4/5, 4 процесса на узел, отказ у процессов GPU2 и GPU3. Повторять так:
#   bash submit.sh --time=00:05:00 --nodes=2 --ntasks=8 --ntasks-per-node=4 --gpus-per-node=4 --nodelist=g5500-4,g5500-5 task.sbatch flannel
# Смотреть: ucx/*.err — строки с "lane", "tcp", "flannel", "ens18f1np1".

UCX_PATHS=1
BLOCK_ENV[tcpdbg]="UCX_TLS=all UCX_LOG_LEVEL=debug"
PLAN=("tcpdbg 1 default one_to_one 1024:5:1")
