# Поиск порога eager/rendezvous по измерению — ПО МЕТОДИКЕ (слайд «Предлагаемая методика»).
# То же, что autothresh.conf (hyp_12349) + autothresh_small.txt (hyp_12358), но:
#   1) нагрузка CPU 1 с перед первой парой (--prespin-sec 1)          — было и раньше;
#   2) случайный порядок пар и запусков (--order random, зерно — номер задания) — было и раньше;
#   3) диагностика до и после каждой пары (--probe: частота ядра, тест L3)   — НОВОЕ;
#   5) несколько независимых заданий через submit_series.sh                   — НОВОЕ (раньше одно задание).
# Сетка: 1 … 512 Б (×2) и 1 КБ … 4 МБ (×√2) в одном задании — чтобы проверить и лучший порог 65 Б между узлами.
# Каждый размер трижды: auto (порог UCX), eager (UCX_RNDV_THRESH=inf), rndv (UCX_RNDV_THRESH=0).
#
# Запуск 4 заданий друг за другом на одни и те же узлы (~45 мин каждое):
#   bash experiments/submit_series.sh autothresh_method 4
#   NODES=g5500-2,g5500-3 bash experiments/submit_series.sh autothresh_method 4
# Обработка (задания объединяются, медиана — по парам и заданиям):
#   python3 analysis/autothresh.py results/hyp_<1> results/hyp_<2> results/hyp_<3> results/hyp_<4> --plot autothresh_method.png

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--order random --prespin-sec 1 --probe)

BLOCK_ENV[eager]="UCX_RNDV_THRESH=inf"
BLOCK_ENV[rndv]="UCX_RNDV_THRESH=0"
BLOCK_ENV[proto_eager]="UCX_RNDV_THRESH=inf"
BLOCK_ENV[proto_rndv]="UCX_RNDV_THRESH=0"
PROTO_BLOCKS=(proto_auto proto_eager proto_rndv)

SIZES=(1 2 4 8 16 32 64 128 256 512)
B=1024
while (( B <= 4194304 )); do
	SIZES+=("$B")
	SIZES+=("$(( (B * 14142 + 5000) / 10000 ))")
	B=$((B * 2))
done
unset 'SIZES[${#SIZES[@]}-1]'   # последний (≈5,9 МБ) не нужен

for B in "${SIZES[@]}"; do
	if (( B >= 4194304 )); then CASE="${B}:200:20"; else CASE="${B}:300:50"; fi
	for M in auto eager rndv; do
		PLAN+=("${M} 1 custom one_to_one ${CASE}")
	done
done
for M in auto eager rndv; do
	PLAN+=("proto_${M} 1 custom one_to_one 65536:50:10")
done
