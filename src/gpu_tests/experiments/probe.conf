# Тесты частоты ядра и задержки L3 до и после каждой пары (бывший task5.sbatch, данные hyp_11082).
# Запуск: bash submit.sh --time=01:00:00 task.sbatch probe
# До и после каждой пары оба участника меряют цепочку умножений (частота ядра)
# и переходы по 8 МБ (задержка L3, внеядерная часть процессора).

REQUIRE=--probe
SHUFFLE_SEED=5
SEED_BASE=3000
LOG_FREQ=1
LOG_TOPOLOGY=1
COMMON=(--order random --cpu-log --prespin-sec 1 --probe)

PLAN=(
	"probe 12 auto one_to_one_v2 16000:2000:500"
	"probe 12 host one_to_one_v2 16000:2000:500"
)
