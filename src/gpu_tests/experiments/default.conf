# Обычное измерение: все режимы и размеры в средах auto и host.
# Запуск: bash submit.sh   (то же, что bash submit.sh task.sbatch default)
# Результаты: results/<узлы>_<среда>_<режим>_b<байт>_w<прогрев>_i<итераций>.txt

OUT_LAYOUT=flat

ENVS=( # закомментировать лишнее
	auto
	host
)
MODES=( # закомментировать лишнее
	one_to_one
	all_to_all
	one_to_all
	all_to_one
)

ONE_TO_ONE_CASES=( # "bytes:iters:warmup"
	"1000:2000:5"
	"2000:2000:5"
	"4000:2000:5"
	"8000:2000:5"
	"16000:2000:5"
	"32000:2000:5"
	"64000:2000:5"
	"128000:2000:5"
	"256000:2000:5"
	"512000:2000:5"
	"1024000:1000:5"
	"2048000:1000:5"
	"4096000:1000:5"
	"8192000:100:5"
	"16384000:100:5"
)
ALL_TO_ALL_CASES=( # "bytes:iters:warmup"
	"512000:1000:5"
	"4096000:500:5"
	"16384000:200:5"
)
# one_to_all и all_to_one: раунд на каждый корень, итерации на раунд
ROOTED_CASES=( # "bytes:iters:warmup"
	"512000:1000:5"
	"4096000:500:5"
	"16384000:200:5"
)

for ENV in "${ENVS[@]}"; do
	for MODE in "${MODES[@]}"; do
		case "${MODE}" in
		one_to_one) CASES=("${ONE_TO_ONE_CASES[@]}") ;;
		all_to_all) CASES=("${ALL_TO_ALL_CASES[@]}") ;;
		one_to_all|all_to_one) CASES=("${ROOTED_CASES[@]}") ;;
		esac
		for CASE in "${CASES[@]}"; do
			PLAN+=("main 1 ${ENV} ${MODE} ${CASE}")
		done
	done
done
