# Проверка выбора UCX на одной паре GPU0 ↔ GPU1 внутри узла при размере 1024 Б.
# Запуск из src/gpu_tests на той же конфигурации, что и ppncheck:
#   bash submit.sh --time=00:05:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 \
#       --gpus-per-node=4 --nodelist=g5500-2,g5500-3 task.sbatch ram_choice
# Сравнивать медианы для одного направления на одном узле, отдельно по каждому повтору.
# В журналах proto смотреть отправку из CUDA-памяти внутри узла при 1024 Б.
# auto_ppn2 и auto_ppn8 меняют только предполагаемое число процессов на узле для UCX.
# Принудительные eager и rndv при ppn=2 дают контрольные задержки для двух маршрутов.

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
COMMON=(--gpus 0,1 --order random --prespin-sec 1)
REQUIRE=--gpus

for variant in auto_ppn2 auto_ppn8 eager rndv; do
	case "${variant}" in
		auto_ppn2) settings="UCX_NUM_PPN=2" ;;
		auto_ppn8) settings="UCX_NUM_PPN=8" ;;
		eager)     settings="UCX_NUM_PPN=2 UCX_RNDV_THRESH=inf" ;;
		rndv)      settings="UCX_NUM_PPN=2 UCX_RNDV_THRESH=0" ;;
	esac
	BLOCK_ENV[${variant}]="UCX_PROTO_ENABLE=y ${settings}"
	BLOCK_ENV[proto_${variant}]="${settings}"
	PROTO_BLOCKS+=("proto_${variant}")
	PLAN+=("${variant} 3 custom one_to_one 1024:300:50")
	PLAN+=("proto_${variant} 1 custom one_to_one 1024:20:5")
done
