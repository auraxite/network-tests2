# Проверка гипотезы: пороги eager/rendezvous зависят от числа процессов на узле, потому что UCX делит общую оценку
# пропускной способности на ppn (в ucx_info -d: «2200.00/ppn»). В задании меняется только UCX_NUM_PPN
# (по умолчанию auto — Open MPI сообщает число процессов на узле); число процессов фиксировано: 2 на узел.
# Каждый блок печатает таблицы UCX_PROTO_INFO (пороги внутри узла и между узлами).
#
# Предсказание гипотезы: proto_p2 = proto_auto; proto_p4 даёт пороги прежних заданий на 4 процесса на узел
# (1 443–1 775 Б внутри узла, 556–709 КБ между узлами); proto_p1 и proto_p8 сдвигают пороги в разные стороны.
# Если все блоки дают одинаковые таблицы — гипотеза опровергнута.
#
# Запуск (~2 мин: 5 блоков по ~10 с):
#   bash submit.sh --time=00:15:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 task.sbatch ppncheck

COLLECT_ENV=1
COMMON=(--gpus 0,1)
REQUIRE=--gpus

BLOCK_ENV[proto_p1]="UCX_NUM_PPN=1"
BLOCK_ENV[proto_p2]="UCX_NUM_PPN=2"
BLOCK_ENV[proto_p4]="UCX_NUM_PPN=4"
BLOCK_ENV[proto_p8]="UCX_NUM_PPN=8"
PROTO_BLOCKS=(proto_auto proto_p1 proto_p2 proto_p4 proto_p8)

PLAN=()
for P in auto p1 p2 p4 p8; do
	PLAN+=("proto_${P} 1 custom one_to_one 1024:20:5")
done
