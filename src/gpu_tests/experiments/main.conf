# Основной эксперимент и проверка методики. UCX 1.22, два узла по 4 GPU (56 пар), one_to_one.
# Ставить несколькими независимыми заданиями: bash experiments/submit_main.sh 8
# Выводы и обоснование — work/diploma/план_экспериментов.md.
#
# Среды: custom (пары GPU разных процессоров — через RAM, --sys-via-host по умолчанию) и host.
# Размеры:
#   сетка ×8 до 16 МБ — в обеих средах;
#   «бордюры» порогов UCX 1.22 (последний размер до порога и первый после) — только custom
#   (в host порогов нет). Пороги взяты из таблиц hyp_12027 — именно этой конфигурации (8 процессов,
#   2 узла): они зависят от числа процессов и от GPU отправителя (одинаковы на обоих узлах):
#     внутри узла, переход на cuda_ipc:      1442/1443 (GPU1, GPU2), 1774/1775 (GPU0, GPU3)
#     между узлами, переход на rendezvous:   GPU0 676483/676484, GPU1 709472/709473,
#                                            GPU2 556430/556431, GPU3 568883/568884
#     между узлами, eager zero-copy -> copy-in (GPU второго процессора): GPU2 2895/2896, GPU3 2751/2752
# Варианты методики (custom, 32 КБ и 2 МБ), каждый отличается от полного одним шагом:
#   full       случайный порядок, нагрузка CPU 1 с, диагностика (это и есть основной вариант)
#   noprespin  без нагрузки CPU
#   seq        последовательный порядок
#   noprobe    без диагностики (не искажает ли она замер)
#   old        по-старому: последовательно, без нагрузки, без диагностики
# proto — таблицы порогов UCX в каждом задании: проверка, что пороги не меняются между заданиями.

# Свой порядок запусков и пар в каждом задании (воспроизводится по номеру задания)
SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
LOG_FREQ=1
PROTO_BLOCKS=(proto)
REQUIRE=--no-sys-via-host   # программа с --sys-via-host и --gpus (иначе пересобрать)

FULL="--order random --prespin-sec 1 --probe"
CASE() {   # размер -> байты:итерации:прогрев
	if (( $1 >= 16777216 )); then echo "$1:300:30"; else echo "$1:1000:100"; fi
}

GRID=(1 8 64 512 4096 32768 262144 2097152 16777216)
BORDERS=(1442 1443 1774 1775 2751 2752 2895 2896
	556430 556431 568883 568884 676483 676484 709472 709473)

PLAN=()
for B in "${GRID[@]}" "${BORDERS[@]}"; do
	PLAN+=("full 1 custom one_to_one $(CASE "$B") ${FULL}")
done
for B in "${GRID[@]}"; do
	PLAN+=("full 1 host one_to_one $(CASE "$B") ${FULL}")
done
for B in 32768 2097152; do
	PLAN+=("noprespin 1 custom one_to_one $(CASE "$B") --order random --probe")
	PLAN+=("seq       1 custom one_to_one $(CASE "$B") --order seq --prespin-sec 1 --probe")
	PLAN+=("noprobe   1 custom one_to_one $(CASE "$B") --order random --prespin-sec 1")
	PLAN+=("old       1 custom one_to_one $(CASE "$B") --order seq")
done
PLAN+=("proto 1 custom one_to_one 16000:20:2 ${FULL}")
