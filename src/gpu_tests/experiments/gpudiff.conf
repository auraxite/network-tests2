# Почему пороги eager/rendezvous у GPU0 и GPU1 разные (≈ в 1,23 раза внутри узла), хотя топология одинакова
# (оба за одним PCIe-коммутатором, до адаптеров — NODE, NVLink 12×25 ГБ/с). Зависимость от ppn уже объяснена
# (ppncheck, hyp_12620). Блоки (везде 2 узла × 2 процесса, MPI_Send, таблицы UCX_PROTO_INFO):
#   proto_g01   GPU0, GPU1 — повтор: устойчивы ли пороги между заданиями
#   proto_g10   те же GPU, ранги поменяны местами (--gpus 1,0): порог следует за GPU или за рангом?
#   proto_g23   GPU2, GPU3 другого процессора: у них ранее были те же два значения
#   proto_norc  GPU0, GPU1 без транспорта rc (список custom без rc_verbs, rc_mlx5): различие из-за оценки пути GPU → адаптер?
#   proto_dbg   GPU0, GPU1 с UCX_LOG_LEVEL=debug: в журнале — оценки пропускной способности устройств и путей
# collect_env.sh пишет скорость и ширину каждой связи PCIe (sysfs) и pcie.link.gen GPU — до запусков.
#
# Запуск (~2 мин):
#   bash submit.sh --time=00:15:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 task.sbatch gpudiff

COLLECT_ENV=1
REQUIRE=--gpus

BLOCK_ENV[proto_norc]="UCX_TLS=cuda_copy,cuda_ipc,ud_verbs,ud_mlx5,dc_mlx5,cma,sm,self"   # как custom, без rc
BLOCK_ENV[proto_dbg]="UCX_LOG_LEVEL=debug"
PROTO_BLOCKS=(proto_g01 proto_g10 proto_g23 proto_norc proto_dbg)

PLAN=(
	"proto_g01 1 custom one_to_one 1024:20:5 --gpus 0,1"
	"proto_g10 1 custom one_to_one 1024:20:5 --gpus 1,0"
	"proto_g23 1 custom one_to_one 1024:20:5 --gpus 2,3"
	"proto_norc 1 custom one_to_one 1024:20:5 --gpus 0,1"
	"proto_dbg 1 custom one_to_one 1024:20:5 --gpus 0,1"
)
