# Нужен ли прогрев передачами (--warmup N) в UCX 1.22 — с методикой и без неё.
# Раньше (UCX 1.15, hyp_11013, hyp_11065, 4 GPU, без методики) прогрев 5 / 500 / 2000 передач медиану
# не менял (±1% при случайном порядке), а замедление первой пары запуска (разгон ядер CPU, 0,2–0,4 с)
# убирала только нагрузка CPU 1 с (hyp_11078). Здесь проверяем это заново и смотрим не только медиану:
#   - медиана пары при прогреве 0 / 100 / 1000 передач;
#   - начало серии: первая итерация и первые 10 итераций против установившегося уровня (raw/*.raw)
#     — то, что прогрев передачами и должен убирать (установление соединения, регистрация памяти, IPC);
#   - первая пара запуска против остальных пар того же класса.
# Два блока:
#   meth — по методике: нагрузка CPU 1 с перед первой парой и диагностика до/после каждой пары;
#   bare — без нагрузки CPU и без диагностики (диагностика между парами сама работает как прогрев CPU).
# В обоих блоках случайный порядок пар и запусков (зерно — номер задания); 5-й шаг методики —
# несколько заданий через submit_series.sh.
# Размеры: 64 Б (eager) и 2 МБ (rendezvous); прогрев 0 / 100 / 1000; 300 итераций — сокращено по времени.
#
# Два узла, GPU0 и GPU1 на каждом (одного процессора), 12 пар — сокращено по времени.
# Запуск 2 заданий (~2 мин каждое) на g5500-4/5, 4 процесса (2 на узел):
#   bash experiments/submit_series.sh warmup_method 2
# Обработка:
#   python3 analysis/warmup.py results/hyp_<1> results/hyp_<2>

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--gpus 0,1 --order random)

PLAN=()
for B in 64 2097152; do
	for W in 0 100 1000; do
		PLAN+=("meth 1 custom one_to_one ${B}:300:${W} --prespin-sec 1 --probe")
		PLAN+=("bare 1 custom one_to_one ${B}:300:${W}")
	done
done
