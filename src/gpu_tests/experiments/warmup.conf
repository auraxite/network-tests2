# Прогрев, повторы, режимы с корнем, длинные серии (бывший task2.sbatch, данные hyp_11013).
# Запуск: bash submit.sh --time=01:30:00 task.sbatch warmup
#   warm  — прогрев w5 / w500 / w2000, 3 повтора (они же независимые повторы)
#   modes — one_to_all, all_to_one и all_to_all для сравнения
#   long  — длинные серии one_to_one

REQUIRE=one_to_all
LOG_FREQ=1

for ENV in auto host; do
	for CASE in 16000:2000:5 16000:2000:500 16000:2000:2000 \
	            4096000:2000:5 4096000:2000:500 4096000:2000:2000; do
		PLAN+=("warm 3 ${ENV} one_to_one ${CASE}")
	done
	for MODE in one_to_all all_to_one all_to_all; do
		for CASE in 512000:1000:5 4096000:500:5 16384000:200:5; do
			PLAN+=("modes 1 ${ENV} ${MODE} ${CASE}")
		done
	done
	for CASE in 16000:20000:5 4096000:10000:5; do
		PLAN+=("long 1 ${ENV} one_to_one ${CASE}")
	done
done
