# MPI_Send против MPI_Isend+MPI_Wait в one_to_one при пороге UCX по умолчанию.
# По таблицам proto и исходникам (work/diploma/пороги_ucx.md, раздел 7в): для MPI_Send Open MPI передаёт UCX флаг
# FAST_CMPL — между узлами из памяти GPU eager до ~676 КБ; для MPI_Isend/MPI_Irecv — MULTI_SEND
# (pml_ucx_multi_send_nb=1 по умолчанию) — rendezvous с 1 Б. Здесь это проверяется прямым замером:
#   blk — --p2p blocking (MPI_Send/MPI_Recv, как во всех прежних заданиях);
#   nb  — --p2p nonblocking (MPI_Isend/MPI_Irecv + MPI_Wait).
# Остальное как в основном эксперименте: custom, 4 GPU на узел (56 пар), случайный порядок, нагрузка CPU 1 с.
# Обработка: python3 analysis/p2pcheck.py results/hyp_<задание>
#
# Нужна пересборка программы (ключ --p2p): bash build/build.sh
# Запуск (~6 мин):
#   bash submit.sh --time=00:20:00 --nodes=2 --ntasks=8 --ntasks-per-node=4 --gpus-per-node=4 \
#        --nodelist=g5500-2,g5500-3 task.sbatch p2pcheck

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--order random --prespin-sec 1 --probe)   # методика целиком (шаги 1–3)
REQUIRE=--p2p
PROTO_BLOCKS=(proto_blk proto_nb)

PLAN=()
for B in 128 1024 8192 65536 524288 2097152; do
	PLAN+=("blk 1 custom one_to_one ${B}:300:50 --p2p blocking")
	PLAN+=("nb 1 custom one_to_one ${B}:300:50 --p2p nonblocking")
done
PLAN+=("proto_blk 1 custom one_to_one 65536:50:10 --p2p blocking")
PLAN+=("proto_nb 1 custom one_to_one 65536:50:10 --p2p nonblocking")
