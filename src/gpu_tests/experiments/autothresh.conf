# Автоматический поиск порога eager/rendezvous по измерению (а не по модели оценок UCX).
# Каждый размер меряется трижды:
#   auto   — порог выбирает UCX (как в обычных запусках);
#   eager  — UCX_RNDV_THRESH=inf: rendezvous не включается ни на каком размере;
#   rndv   — UCX_RNDV_THRESH=0:   rendezvous на любом размере.
# Лучший порог для класса пар — размер, с которого rendezvous быстрее eager (пересечение кривых).
# Обработка: python3 analysis/autothresh.py results/hyp_<задание>
#   — таблица порогов по классам пар (GPU отправителя × внутри узла / между узлами), выигрыш и,
#     если пересечение попало между точками сетки, experiments/autothresh_refine.conf (уточняющий прогон).
#
# Запуск (два узла по 4 GPU, все пары):
#   bash submit.sh --time=00:40:00 --nodes=2 --ntasks=8 --ntasks-per-node=4 --gpus-per-node=4 \
#        --nodelist=g5500-4,g5500-5 task.sbatch autothresh
# Около 25 минут: 3 режима × 25 размеров по ~10 с (большую часть занимает старт MPI и UCX) + 3 запуска proto.
#
# proto_* — по одному запуску с таблицами протоколов UCX в каждом режиме: проверка, что UCX_RNDV_THRESH
# действительно меняет выбор (в UCX 1.22 выбор протоколов — механизм proto v2; это надо подтвердить).
# Сетку уточнения можно задать снаружи: SIZES_FILE=experiments/autothresh_sizes.txt (по размеру в строке).

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--order random --prespin-sec 1)

BLOCK_ENV[eager]="UCX_RNDV_THRESH=inf"
BLOCK_ENV[rndv]="UCX_RNDV_THRESH=0"
BLOCK_ENV[proto_eager]="UCX_RNDV_THRESH=inf"
BLOCK_ENV[proto_rndv]="UCX_RNDV_THRESH=0"
PROTO_BLOCKS=(proto_auto proto_eager proto_rndv)

SIZES=()
if [[ -n "${SIZES_FILE:-}" ]]; then
	while read -r B; do [[ -n "$B" ]] && SIZES+=("$B"); done < "${SIZES_FILE}"
else
	# 1 КБ … 4 МБ с шагом √2: 1024, 1448, 2048, 2896, …
	B=1024
	while (( B <= 4194304 )); do
		SIZES+=("$B")
		SIZES+=("$(( (B * 14142 + 5000) / 10000 ))")
		B=$((B * 2))
	done
	unset 'SIZES[${#SIZES[@]}-1]'   # последний (≈5,9 МБ) не нужен
fi

for B in "${SIZES[@]}"; do
	if (( B >= 4194304 )); then CASE="${B}:200:20"; else CASE="${B}:300:50"; fi
	for M in auto eager rndv; do
		PLAN+=("${M} 1 custom one_to_one ${CASE}")
	done
done
for M in auto eager rndv; do
	PLAN+=("proto_${M} 1 custom one_to_one 65536:50:10")
done
