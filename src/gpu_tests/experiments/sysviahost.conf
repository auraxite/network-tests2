# Ключ --sys-via-host: пары GPU разных процессоров одного узла модуль сам копирует через RAM,
# остальные пары — как задаёт среда. Сравнение с crosssocket.conf (hyp_12015), где те же пары в
# custom и default шли напрямую (cuda_ipc): 16 КБ — 49–98 мс, 4 МБ — 3,3 с; через RAM (host) — 24 мкс и 0,34 мс.
# Запуск (как crosssocket: два узла, GPU0 и GPU2 на каждом):
#   bash submit.sh --time=00:15:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 task.sbatch sysviahost
# Ожидаемое время 3–5 мин: медленных пар нет.
# Проверить в результатах: пары GPU0 <-> GPU2 одного узла ≈ host; пары между узлами — как без ключа
# (custom в hyp_12015: 4 МБ — 346–433 мкс); строка «SYS pairs via host: on» в шапке.

SHUFFLE_SEED=9
SEED_BASE=9000
COLLECT_ENV=1
COMMON=(--order random --prespin-sec 1 --gpus 0,2)
REQUIRE=--sys-via-host   # программа должна знать ключ (иначе пересобрать)

PLAN=()
for ENV in custom default; do
	PLAN+=("sys 1 ${ENV} one_to_one 1024:200:20 --sys-via-host")
	PLAN+=("sys 1 ${ENV} one_to_one 16000:200:20 --sys-via-host")
	PLAN+=("sys 1 ${ENV} one_to_one 4096000:50:5 --sys-via-host")
done
# опорные: host на тех же размерах и числе итераций
PLAN+=("ref 1 host one_to_one 16000:200:20")
PLAN+=("ref 1 host one_to_one 4096000:50:5")
