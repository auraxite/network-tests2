# Одновременные режимы на UCX 1.22. Два узла, GPU0 и GPU1 на каждом (одного процессора: --sys-via-host
# в одновременных режимах не работает, а прямой путь между GPU разных процессоров в тысячи раз медленнее).
# Запуск:
#   bash submit.sh --time=00:20:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 \
#        --nodelist=g5500-4,g5500-5 task.sbatch modes
# Ожидаемое время ~5–10 мин.

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
SEED_BASE=$(( (${SLURM_JOB_ID:-1} % 100000) * 100 ))
COLLECT_ENV=1
COMMON=(--gpus 0,1)
REQUIRE=--gpus

PLAN=()
for ENV in custom host; do
	for MODE in one_to_one all_to_all one_to_all all_to_one; do
		for B in 64 32768 2097152 16777216; do
			if (( B >= 16777216 )); then C="$B:200:20"; else C="$B:500:50"; fi
			PLAN+=("modes 1 ${ENV} ${MODE} ${C}")
		done
	done
done
