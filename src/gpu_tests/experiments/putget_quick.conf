# UCX 1.22, one GPU per node. Force rendezvous and log the selected protocol.
# 64/65 B checks the automatic transition. From 65 B compare GET and PUT.
# Compare measurements only if the CUDA tag_send tables confirm the intended
# operations over the same rc_mlx5 device. The fetch tables alone are insufficient.

PROTO_BLOCKS=(rndv_auto rndv_get rndv_put)
BLOCK_ENV[rndv_auto]="UCX_RNDV_THRESH=0 UCX_RNDV_SCHEME=auto"
BLOCK_ENV[rndv_get]="UCX_RNDV_THRESH=0 UCX_RNDV_SCHEME=get_zcopy"
BLOCK_ENV[rndv_put]="UCX_RNDV_THRESH=0 UCX_RNDV_SCHEME=put_zcopy"

SHUFFLE_SEED="${SLURM_JOB_ID:-1}"
PLAN=("rndv_auto 1 custom one_to_one 64:300:50")
for bytes in 65 1024 65536; do
	for block in "${PROTO_BLOCKS[@]}"; do
		PLAN+=("${block} 1 custom one_to_one ${bytes}:300:50")
	done
done
