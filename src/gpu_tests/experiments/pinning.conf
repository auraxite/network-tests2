# Привязка главного потока к ядру, номер CPU на каждой итерации, нагрузка CPU перед первой парой
# (бывший task4.sbatch, данные hyp_11078).
# Запуск: bash submit.sh --time=01:00:00 task.sbatch pinning
#   free — главный поток на всей маске ранга
#   pin0 — главный поток на 0-м CPU маски (у ранга 0 это CPU 0, там прерывания)
#   pin1 — главный поток на 1-м CPU маски

REQUIRE=--pin-main
SHUFFLE_SEED=4
SEED_BASE=2000
LOG_FREQ=1
LOG_TOPOLOGY=1
COMMON=(--order random --cpu-log --prespin-sec 1)

PLAN=(
	"free 8 auto one_to_one_v2 16000:2000:500"
	"free 8 host one_to_one_v2 16000:2000:500"
	"pin0 6 auto one_to_one_v2 16000:2000:500 --pin-main 0"
	"pin0 6 host one_to_one_v2 16000:2000:500 --pin-main 0"
	"pin1 6 auto one_to_one_v2 16000:2000:500 --pin-main 1"
	"pin1 6 host one_to_one_v2 16000:2000:500 --pin-main 1"
	"free 3 auto one_to_one_v2 4096000:2000:500"
	"pin1 3 auto one_to_one_v2 4096000:2000:500 --pin-main 1"
)
