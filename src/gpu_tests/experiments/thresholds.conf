# Где реальные замеры переключают путь: частая сетка размеров около порогов UCX.
# По журналу UCX (блок proto в paths.conf, механизм UCX_PROTO_ENABLE=y) пороги на G5500 V7:
# внутри узла 5363 Б, между узлами 566751 Б. Обычные замеры идут на старом механизме выбора
# протоколов, поэтому реальное место переключения ищется по скачку задержки на этой сетке.
# Пороги взяты с UCX 1.15.0. На UCX 1.22.0 (по умолчанию с 05.11.2026) они могут быть другими:
# сначала задание paths, по его таблицам UCX_PROTO_INFO при необходимости сдвинуть сетку.
#
# Запуск (все 4 GPU на узел, все пары обоих узлов):
#   bash submit.sh --time=00:30:00 --ntasks=8 --ntasks-per-node=4 --gpus-per-node=4 task.sbatch thresholds
# Работает около 15–20 минут: 2 среды × 34 размера по ~10 с (из них ~8 с — старт MPI и UCX).
# Повторов нет: здесь ищется положение скачка, разброс — в основном эксперименте.

SHUFFLE_SEED=7
SEED_BASE=7000
COLLECT_ENV=1
COMMON=(--order random --prespin-sec 1)

ENVS=(custom default)

SIZES=()
# внутри узла: от 4 КБ до 8 КБ с шагом 256 Б, плюс байты по обе стороны порога
for ((b = 4096; b <= 8192; b += 256)); do SIZES+=("$b"); done
SIZES+=(5363 5364)
# между узлами: от 256 КБ до 1 МБ с шагом 64 КБ, плюс байты по обе стороны порога
for ((b = 262144; b <= 1048576; b += 65536)); do SIZES+=("$b"); done
SIZES+=(566751 566752)

for ENV in "${ENVS[@]}"; do
	for B in "${SIZES[@]}"; do
		PLAN+=("thr 1 ${ENV} one_to_one ${B}:300:50")
	done
done
