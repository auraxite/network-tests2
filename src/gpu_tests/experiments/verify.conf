# Доходит ли сообщение целиком и к моменту отметки времени (ключ --verify). В каждой итерации
# отправитель кладёт новый шаблон (зависит от номера итерации и пары), получатель перед итерацией
# обнуляет буфер приёма, после замера сверяет длину (MPI_Get_count) и всё содержимое.
# В одновременных режимах с буферами в VRAM время пары берётся без синхронизации устройства;
# там дополнительно в момент отметки времени читаются первые и последние 4 КБ сообщения
# (своим неблокирующим потоком CUDA) — счётчик early: сколько итераций отметка времени
# опередила приход данных.
# Строки результата: "verify <src> -> <dst> checked=N bad=M early=K". Ожидается bad=0 везде.
# Времена в этих запусках не сравнивать с обычными: проверка меняет состояние кэшей и памяти.
#
# Блоки:
#   v_same  GPU0, GPU1 на каждом из 2 узлов (один процессор): custom, default, host × 4 режима × 5 размеров
#           (размеры по обе стороны порогов eager/rendezvous и конвейера)
#   v_nb    то же one_to_one custom с --p2p nonblocking (другие протоколы UCX)
#   v_sys   GPU0, GPU2 (разные процессоры): custom one_to_one, пары внутри узла идут через общую RAM
#           (--sys-via-host по умолчанию)
#
# Запуск (~10 мин):
#   bash submit.sh --time=00:30:00 --nodes=2 --ntasks=4 --ntasks-per-node=2 --gpus-per-node=4 task.sbatch verify

COLLECT_ENV=1
REQUIRE=--verify
COMMON=(--verify)

SIZES=(64 8192 65536 1048576 16777216)

PLAN=()
for ENV in custom default host; do
	for MODE in one_to_one all_to_all one_to_all all_to_one; do
		for B in "${SIZES[@]}"; do
			PLAN+=("v_same 1 ${ENV} ${MODE} ${B}:100:10 --gpus 0,1")
		done
	done
done
for B in "${SIZES[@]}"; do
	PLAN+=("v_nb 1 custom one_to_one ${B}:100:10 --gpus 0,1 --p2p nonblocking")
	PLAN+=("v_sys 1 custom one_to_one ${B}:100:10 --gpus 0,2")
done
